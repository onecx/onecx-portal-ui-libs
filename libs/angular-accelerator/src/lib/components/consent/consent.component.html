@if (hasConsent()) {
<ng-content />

@if (showWithdraw()) {
<div class="w-full flex justify-center mt-1">
  <a
    (click)="resetConsent()"
    class="cursor-pointer text-primary underline"
    [attr.aria-label]="withdrawKey() | translate"
  >
    {{ withdrawKey() | translate }}
  </a>
</div>
} } @else {
<section
  class="flex w-full h-full items-center justify-center p-3 ocx-consent"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="messageId"
>
  <div class="flex flex-col gap-4 items-center justify-center text-center ocx-consent__content">
    <ng-template #consentTitle>{{ titleKey() | translate }}</ng-template>
    @switch (headingLevel()) {
      @case (1) {
        <h1 class="m-0 text-xl font-semibold" [id]="titleId"><ng-container [ngTemplateOutlet]="consentTitle"></ng-container></h1>
      }
      @case (2) {
        <h2 class="m-0 text-xl font-semibold" [id]="titleId"><ng-container [ngTemplateOutlet]="consentTitle"></ng-container></h2>
      }
      @case (3) {
        <h3 class="m-0 text-xl font-semibold" [id]="titleId"><ng-container [ngTemplateOutlet]="consentTitle"></ng-container></h3>
      }
      @case (4) {
        <h4 class="m-0 text-xl font-semibold" [id]="titleId"><ng-container [ngTemplateOutlet]="consentTitle"></ng-container></h4>
      }
      @case (5) {
        <h5 class="m-0 text-xl font-semibold" [id]="titleId"><ng-container [ngTemplateOutlet]="consentTitle"></ng-container></h5>
      }
      @case (6) {
        <h6 class="m-0 text-xl font-semibold" [id]="titleId"><ng-container [ngTemplateOutlet]="consentTitle"></ng-container></h6>
      }
    }
    <p class="m-0" [id]="messageId" aria-live="polite">{{ messageKey() | translate : { url: normalizedUrl() } }}</p>

    <ng-content select="[ocx-consent-info]" />

    <button pButton pRipple type="button" (click)="giveConsent()" [attr.aria-label]="agreeKey() | translate">
      {{ agreeKey() | translate }}
    </button>
  </div>
</section>
}
