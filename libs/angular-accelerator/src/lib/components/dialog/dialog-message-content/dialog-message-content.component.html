<div class="dialogMessageContent">
  <div>
    @if (icon !== '') {
      <i [class]="icon" aria-hidden="true"></i>
      @if (iconLabelKey; as labelKey) {
        <span
          class="dialogMessageIconLabel sr-only"
          >{{ labelKey | translate:iconLabelParameters }}. </span
        >
      }
    }
    <span [id]="messageId" class="dialogMessageText">{{message | translate:messageParameters}}</span>
  </div>
</div>
