<p-timeline [value]="steps()" [pt]="timelinePt">
  <ng-template pTemplate="marker" let-step>
    <span class="p-timeline-event-marker" aria-hidden="true" [ngClass]="isActive(step) ? 'bg-primary' : ''"></span>
  </ng-template>
  <ng-template pTemplate="content" let-step>
    <div class="pb-4 h-full">
      <div
        class="card h-full"
        [ngClass]="isActive(step) ? 'bg-primary ocx-lifecycle-step-active' : ''"
        [attr.aria-current]="isActive(step) ? 'step' : null"
      >
        <ng-template #stepTitle>@if (isActive(step)) {<span class="pi pi-map-marker ocx-lifecycle-current-icon" aria-hidden="true"></span>}{{ step.title }}</ng-template>
        @switch (headingLevel()) {
          @case (1) {
            <h1 class="font-bold text-xl m-0" [ngClass]="step.details ? 'mb-2' : ''"><ng-container [ngTemplateOutlet]="stepTitle"></ng-container></h1>
          }
          @case (2) {
            <h2 class="font-bold text-xl m-0" [ngClass]="step.details ? 'mb-2' : ''"><ng-container [ngTemplateOutlet]="stepTitle"></ng-container></h2>
          }
          @case (3) {
            <h3 class="font-bold text-xl m-0" [ngClass]="step.details ? 'mb-2' : ''"><ng-container [ngTemplateOutlet]="stepTitle"></ng-container></h3>
          }
          @case (4) {
            <h4 class="font-bold text-xl m-0" [ngClass]="step.details ? 'mb-2' : ''"><ng-container [ngTemplateOutlet]="stepTitle"></ng-container></h4>
          }
          @case (5) {
            <h5 class="font-bold text-xl m-0" [ngClass]="step.details ? 'mb-2' : ''"><ng-container [ngTemplateOutlet]="stepTitle"></ng-container></h5>
          }
          @case (6) {
            <h6 class="font-bold text-xl m-0" [ngClass]="step.details ? 'mb-2' : ''"><ng-container [ngTemplateOutlet]="stepTitle"></ng-container></h6>
          }
        }
        @if (step.details) {
        <p [ngClass]="isActive(step) ? '' : 'text-color-secondary'">{{ step.details }}</p>
        }
      </div>
    </div>
  </ng-template>
</p-timeline>
