name: create-release
on: [workflow_dispatch]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      # Skip all Husky hooks for the semantic-release commit (the git plugin commits without --no-verify):
      # release.config.js commits `chore(release): ...` with the changelog as body, which commitlint's
      # body-max-line-length (100) rejects, and pre-commit would run the CI-gated build because CI is set.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version
      - uses: nrwl/nx-set-shas@v4
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npx nx run-many -t lint
      - name: Test
        run: npx nx run-many -t test --configuration=ci
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.CI_PAT }}
