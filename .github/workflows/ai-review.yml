name: AI Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    if: >-
      github.event.sender.login == github.actor &&
      github.event.sender.type != 'Bot' &&
      !endsWith(github.actor, '[bot]') &&
      (
        (
          github.event_name == 'pull_request_target' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.base.repo.full_name == github.repository &&
          github.event.pull_request.head.repo != null &&
          github.event.pull_request.user.type != 'Bot'
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          github.event.comment.body == '@ai-review' &&
          github.event.comment.user.login == github.actor &&
          github.event.comment.user.type != 'Bot'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@v7
        with:
          ref: ${{ vars.AI_REVIEW_AUTOMATION_REF || 'main' }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test dispatcher
        run: node --test .github/scripts/ai-review-dispatch.test.mjs

      - name: Request review
        env:
          AI_REVIEW_DISPATCH_REPOSITORY: ${{ secrets.AI_REVIEW_DISPATCH_REPOSITORY }}
          AI_REVIEW_DISPATCH_REF: ${{ vars.AI_REVIEW_DISPATCH_REF }}
          GH_TOKEN: ${{ secrets.CI_PAT }}
          GH_READ_TOKEN: ${{ github.token }}
        run: node .github/scripts/ai-review-dispatch.mjs
