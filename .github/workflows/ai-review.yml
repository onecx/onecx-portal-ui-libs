name: AI Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing pull request number to review
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  dispatch:
    if: >-
      github.event.sender.login == github.actor &&
      github.triggering_actor == github.actor &&
      github.event.sender.type != 'Bot' &&
      !endsWith(github.actor, '[bot]') &&
      (
        (
          github.event_name == 'pull_request_target' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.base.repo.full_name == github.repository &&
          github.event.pull_request.head.repo != null &&
          github.event.pull_request.user.type != 'Bot'
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          github.event.comment.body == '@ai-review' &&
          github.event.comment.user.login == github.actor &&
          github.event.comment.user.type != 'Bot'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@v7
        with:
          ref: ${{ vars.AI_REVIEW_AUTOMATION_REF || 'main' }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test dispatcher
        run: node --test .github/scripts/ai-review-dispatch.test.mjs

      - name: Check that the PR author requested the review
        id: check
        env:
          AI_REVIEW_DISPATCH_REPOSITORY: ${{ secrets.AI_REVIEW_DISPATCH_REPOSITORY }}
          GH_READ_TOKEN: ${{ github.token }}
        run: node .github/scripts/ai-review-dispatch.mjs --check

      # Reads only the actor's own Vault path; the check above made sure the
      # actor is the PR author.
      - name: Load the PR author's dispatch token
        id: vault
        if: steps.check.outputs.dispatch == 'true'
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.dev.one-cx.org
          method: jwt
          role: github-onecx-role
          jwtGithubAudience: https://github.com
          exportEnv: false
          exportToken: false
          secrets: |
            secret/data/users/${{ github.actor }}/tokens github_token_onecx | GH_TOKEN_ONECX

      - name: Request review
        if: steps.check.outputs.dispatch == 'true'
        env:
          AI_REVIEW_DISPATCH_REPOSITORY: ${{ secrets.AI_REVIEW_DISPATCH_REPOSITORY }}
          AI_REVIEW_DISPATCH_REF: ${{ vars.AI_REVIEW_DISPATCH_REF }}
          GH_TOKEN: ${{ steps.vault.outputs.GH_TOKEN_ONECX }}
          GH_READ_TOKEN: ${{ github.token }}
        run: node .github/scripts/ai-review-dispatch.mjs
